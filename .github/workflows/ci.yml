name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go build ./...

      - run: go vet ./...

      # Includes the golden files that pin every command and request.
      - run: go test ./...

      # The naming tests read the spec, which is built from the committed collections.
      - run: cd codegen && python3 extract_api_spec.py && cd .. && python3 -m unittest discover -s codegen -p 'test_*.py'
