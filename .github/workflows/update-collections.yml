name: Update Postman Collections

on:
  schedule:
    - cron: "0 9 * * 1" # Monday 9am UTC
  workflow_dispatch:

concurrency:
  group: update-postman-collections
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Save old spec
        run: |
          python3 codegen/extract_api_spec.py
          cp codegen/api_spec.json /tmp/old_spec.json

      - name: Download collections
        run: make download

      - name: Run codegen
        run: make codegen

      - name: Build and vet
        run: make check

      - name: Generate changelog
        run: python3 codegen/diff_spec.py /tmp/old_spec.json codegen/api_spec.json > /tmp/spec_diff.md

      - name: Create or update PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No collection or generated-file changes."
            exit 0
          fi

          BRANCH="auto/update-postman-collections"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git commit -m "Update Postman collections and regenerate CLI commands"
          git push -f origin "$BRANCH"

          {
            echo "## Summary"
            echo
            echo "Automated update of Postman collections and regenerated CLI commands and skill docs."
            echo
            echo "## API Changes"
            echo
            cat /tmp/spec_diff.md
          } > /tmp/pr_body.md

          PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$PR" ]; then
            gh pr edit "$PR" --body-file /tmp/pr_body.md
          else
            gh pr create \
              --title "Update Postman collections" \
              --body-file /tmp/pr_body.md \
              --head "$BRANCH" \
              --base main
          fi
