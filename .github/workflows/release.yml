name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write # npm trusted publishing and provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEBEX_CLIENT_ID: ${{ secrets.WEBEX_CLIENT_ID }}
          WEBEX_CLIENT_SECRET: ${{ secrets.WEBEX_CLIENT_SECRET }}
          WEBEX_SCOPES: ${{ secrets.WEBEX_SCOPES }}
          WEBEX_READ_ONLY_SCOPES: ${{ secrets.WEBEX_READ_ONLY_SCOPES }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # npm uses trusted publishing (OIDC) when the packages are configured for
      # it, and falls back to NPM_TOKEN otherwise. The first publish needs the
      # token, because trusted publishing can only be set up on existing packages.
      - name: Publish npm packages
        run: |
          npm install -g npm@11.6.2
          node npm/stage.mjs --dist dist --out npm/build
          sh npm/publish.sh npm/build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
