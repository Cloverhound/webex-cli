name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEBEX_CLIENT_ID: ${{ secrets.WEBEX_CLIENT_ID }}
          WEBEX_CLIENT_SECRET: ${{ secrets.WEBEX_CLIENT_SECRET }}
          WEBEX_SCOPES: ${{ secrets.WEBEX_SCOPES }}

      # Skipped until the NPM_TOKEN secret exists.
      - uses: actions/setup-node@v4
        if: env.NPM_TOKEN != ''
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Publish npm packages
        if: env.NPM_TOKEN != ''
        run: |
          node npm/stage.mjs --dist dist --out npm/build
          sh npm/publish.sh npm/build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
